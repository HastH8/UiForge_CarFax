<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>UiForge CarFax UI Test</title>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				background: #222;
			}

			iframe {
				width: 100%;
				height: 100%;
				border: 0;
			}

			#test-panel {
				position: fixed;
				top: 16px;
				left: 16px;
				z-index: 10;
				background: rgba(20, 20, 20, 0.9);
				color: #f1f1f1;
				padding: 12px;
				border-radius: 8px;
				font-family: "Helvetica Neue", Arial, sans-serif;
				font-size: 12px;
				display: grid;
				gap: 8px;
				min-width: 220px;
				box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
			}

			#test-panel h1 {
				font-size: 12px;
				margin: 0;
				text-transform: uppercase;
				letter-spacing: 0.18em;
			}

			.panel-row {
				display: flex;
				gap: 8px;
				flex-wrap: wrap;
			}

			.panel-row button {
				background: #f5f1ea;
				color: #221e1a;
				border: 0;
				padding: 6px 10px;
				border-radius: 6px;
				cursor: pointer;
				font-size: 11px;
				letter-spacing: 0.08em;
				text-transform: uppercase;
			}

			.panel-row button.secondary {
				background: transparent;
				border: 1px solid rgba(241, 241, 241, 0.3);
				color: #f1f1f1;
			}

			.panel-row label {
				display: flex;
				align-items: center;
				gap: 6px;
			}

			.panel-status {
				font-size: 11px;
				color: #cfcfcf;
			}
		</style>
	</head>
	<body>
		<div id="test-panel">
			<h1>UI Test Panel</h1>
			<div class="panel-row">
				<button type="button" data-action="open-standard">Open Standard</button>
				<button type="button" data-action="open-large">Open Large</button>
				<button type="button" data-action="open-empty" class="secondary">
					Open Empty
				</button>
			</div>
			<div class="panel-row">
				<label
					><input type="checkbox" id="showIdentifiers" checked /> Show
					Identifiers</label
				>
				<label
					><input type="checkbox" id="includePrivate" checked /> Include
					Private</label
				>
			</div>
			<div class="panel-row">
				<button type="button" data-action="close" class="secondary">
					Close
				</button>
				<button type="button" data-action="reload" class="secondary">
					Reload Frame
				</button>
			</div>
			<div class="panel-status" id="panelStatus">Locale: loading...</div>
		</div>
		<iframe id="uiFrame" src="index.html" title="UiForge CarFax UI"></iframe>
		<script>
			const frame = document.getElementById("uiFrame");
			const panelStatus = document.getElementById("panelStatus");
			const showIdentifiers = document.getElementById("showIdentifiers");
			const includePrivate = document.getElementById("includePrivate");

			const fallbackLocale = {
				app_title: "Vehicle History Report",
				app_subtitle: "Official Vehicle History File",
				brand_label: "CARFAX",
				header_vin: "VIN",
				header_plate: "Plate",
				header_report_id: "Report ID",
				header_registration: "Registration Status",
				header_generated: "Generated On",
				section_service: "Service Records",
				section_incident: "Incident Records",
				section_ownership: "Ownership History",
				table_type: "Type",
				table_date: "Date",
				table_mileage: "Mileage",
				table_shop: "Shop",
				table_notes: "Notes",
				table_recorded_by: "Recorded By",
				table_owner: "Owner",
				table_registration: "Registration",
				table_agency: "Agency",
				table_transfer_date: "Transfer Date",
				table_visibility: "Visibility",
				empty_service: "No service records found.",
				empty_incident: "No incident records found.",
				empty_ownership: "No ownership history found.",
				status_private: "Restricted",
				status_public: "Public",
				registration_valid: "Valid",
				registration_expired: "Expired",
				registration_suspended: "Suspended",
				registration_revoked: "Revoked",
				service_type_oil_change: "Oil change",
				service_type_engine_repair: "Engine repair",
				service_type_body_repair: "Body repair",
				service_type_full_inspection: "Full inspection",
				service_type_custom: "Custom service",
				incident_type_insurance_claim: "Insurance claim",
				incident_type_impound: "Impound",
				incident_type_total_loss: "Total loss",
				incident_type_police_seizure: "Police seizure",
				incident_type_stolen_report: "Stolen report",
				owner_index_label: "Owner #%s",
				ui_close: "Close",
				ui_page: "Page",
				ui_pages: "Pages",
				ui_prev_page: "Previous Page",
				ui_next_page: "Next Page",
				placeholder_empty: "-",
			};

			let localeData = { ...fallbackLocale };

			async function loadLocale() {
				try {
					const response = await fetch("../locales/en.json");
					if (!response.ok) {
						throw new Error("Locale fetch failed");
					}
					const data = await response.json();
					localeData = { ...fallbackLocale, ...data };
					panelStatus.textContent = "Locale: locales/en.json";
				} catch (err) {
					panelStatus.textContent = "Locale: fallback";
				}
			}

			function createNotes(seed) {
				if (seed % 3 === 0) {
					return "Inspection performed. No active leaks, belts replaced, and full diagnostic logged.";
				}
				if (seed % 3 === 1) {
					return "Customer requested detailed review. Minor wear noted, alignment adjusted.";
				}
				return "Service documented with photos and part numbers. Warranty filed.";
			}

			function buildServices(count) {
				const types = [
					{ value: "oil_change", label: localeData.service_type_oil_change },
					{
						value: "engine_repair",
						label: localeData.service_type_engine_repair,
					},
					{ value: "body_repair", label: localeData.service_type_body_repair },
					{
						value: "full_inspection",
						label: localeData.service_type_full_inspection,
					},
					{ value: "custom", label: localeData.service_type_custom },
				];

				const now = Math.floor(Date.now() / 1000);
				return Array.from({ length: count }).map((_, index) => {
					const type = types[index % types.length];
					return {
						id: index + 1,
						type: type.value,
						label:
							type.value === "custom" ? "Custom tune & detailing" : type.label,
						notes: createNotes(index),
						job_label: index % 2 === 0 ? "Hayes Autos" : "Harmony Repairs",
						author_identifier: `char-${index + 10}`,
						created_at: now - (index + 1) * 86400,
						mileage: 12000 + index * 850,
					};
				});
			}

			function buildIncidents(count, includePrivateEntries) {
				const types = [
					{
						value: "insurance_claim",
						label: localeData.incident_type_insurance_claim,
						private: false,
					},
					{
						value: "impound",
						label: localeData.incident_type_impound,
						private: false,
					},
					{
						value: "total_loss",
						label: localeData.incident_type_total_loss,
						private: false,
					},
					{
						value: "police_seizure",
						label: localeData.incident_type_police_seizure,
						private: false,
					},
					{
						value: "stolen_report",
						label: localeData.incident_type_stolen_report,
						private: true,
					},
				];

				const now = Math.floor(Date.now() / 1000);
				const rows = Array.from({ length: count }).map((_, index) => {
					const type = types[index % types.length];
					return {
						id: index + 1,
						type: type.value,
						label: type.label,
						notes: "Incident recorded with agency report and follow-up notes.",
						job_label: index % 2 === 0 ? "Vespucci PD" : "State Patrol",
						author_identifier: `officer-${index + 3}`,
						created_at: now - (index + 2) * 172800,
						is_private: type.private,
					};
				});

				if (!includePrivateEntries) {
					return rows.filter((row) => !row.is_private);
				}

				return rows;
			}

			function buildOwners(count) {
				const now = Math.floor(Date.now() / 1000);
				const statuses = [
					{ value: "valid", label: localeData.registration_valid },
					{ value: "expired", label: localeData.registration_expired },
					{ value: "suspended", label: localeData.registration_suspended },
					{ value: "revoked", label: localeData.registration_revoked },
				];

				return Array.from({ length: count }).map((_, index) => {
					const status = statuses[index % statuses.length];
					return {
						id: index + 1,
						owner_index: index + 1,
						owner_label: `Owner #${index + 1}`,
						registration_status: status.value,
						registration_label: status.label,
						notes:
							index % 2 === 0
								? "Ownership transfer logged at DMV office."
								: "Title updated with new registration.",
						created_at: now - (index + 1) * 2592000,
					};
				});
			}

			function buildReport(options) {
				const now = Math.floor(Date.now() / 1000);
				const services = buildServices(options.serviceCount);
				const incidents = buildIncidents(
					options.incidentCount,
					options.includePrivate
				);
				const owners = buildOwners(options.ownerCount);

				return {
					generated_at: now,
					vehicle: {
						plate: "CARFAX1",
						vin: "8JH1K2L3M4N5P6Q7R",
						report_id: "CARFAX-TEST-839201",
						registration_status: "valid",
						registration_label: localeData.registration_valid,
					},
					services,
					incidents,
					owners,
					visibility: {
						show_identifiers: options.showIdentifiers,
					},
				};
			}

			function buildEmptyReport() {
				const now = Math.floor(Date.now() / 1000);
				return {
					generated_at: now,
					vehicle: {
						plate: "EMPTY01",
						vin: "1A2B3C4D5E6F7G8H9",
						report_id: "CARFAX-EMPTY-000001",
						registration_status: "expired",
						registration_label: localeData.registration_expired,
					},
					services: [],
					incidents: [],
					owners: [],
					visibility: {
						show_identifiers: false,
					},
				};
			}

			function sendMessage(payload) {
				if (frame.contentWindow) {
					frame.contentWindow.postMessage(payload, "*");
				}
			}

			function openReport(size) {
				const opts = {
					showIdentifiers: showIdentifiers.checked,
					includePrivate: includePrivate.checked,
					serviceCount: size === "large" ? 22 : 8,
					incidentCount: size === "large" ? 10 : 4,
					ownerCount: size === "large" ? 6 : 3,
				};

				sendMessage({
					type: "open",
					locale: localeData,
					report: buildReport(opts),
				});
			}

			document
				.getElementById("test-panel")
				.addEventListener("click", (event) => {
					const action = event.target.dataset.action;
					if (!action) {
						return;
					}

					if (action === "open-standard") {
						openReport("standard");
					}

					if (action === "open-large") {
						openReport("large");
					}

					if (action === "open-empty") {
						sendMessage({
							type: "open",
							locale: localeData,
							report: buildEmptyReport(),
						});
					}

					if (action === "close") {
						sendMessage({ type: "close" });
					}

					if (action === "reload") {
						frame.src = frame.src;
					}
				});

			loadLocale();
		</script>
	</body>
</html>
